acquisition:
  ps_threshold: 5.0
  target_threshold: 6.0
  tau: 0.1
active_learning_loop:
  n_iterations: 32
  plate_size: 1536
  wells_per_drc: 13
  wells_per_ps: 1
dashboard:
  enabled: true
  export_height: 600
  export_width: 900
  model_metric: mae
  port: 8050
  theme: plotly_dark
data:
  output_dir: demo_output/plan_results
  plan:
    input_csv: data/pxr_campaign_state_manual.csv
    is_canonical: true
    output_csv: campaign_state_annotated.csv
    relation_column: relation
    smiles_column: smiles
    value_column: value
  simulate:
    input_csv: data/pxr_data.csv
    is_canonical: true
    pretrain:
      input_csv: data/pxr_chembl.csv
      is_canonical: true
      relation_column: relation
      smiles_column: SMILES
      value_column: value
    relation_column: relation
    smiles_column: SMILES
    test_set_size: 0.15
    value_column: value
model:
  fast: false
  ffn_hidden_size: 512
  ffn_num_layers: 3
  final_error: 0.65
  freeze_epochs: 1
  initial_error: 1.2
  learnable_sigma: false
  lr_encoder: 0.0001
  lr_head: 0.001
  reset_weights_on_refit: false
  sigma: 0.5
  w_drc: 1.0
  w_ps: 0.3
oracle:
  activity_threshold: 6.0
  cost_drc: 10.0
  cost_ps: 1.0
  ps_threshold: 5.0
  upper_bound: 11.0
seed: 42
trainer:
  accelerator: mps
  enable_model_summary: false
  enable_progress_bar: false
  log_every_n_steps: 1
  max_epochs: 20
  num_workers: 1
  split_seed: 42
  val_fraction: 0.0
