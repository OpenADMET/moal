acquisition:
  ps_threshold: 5.0
  target_threshold: 6.0
  tau: 0.5
active_learning_loop:
  n_iterations: 1
  plate_size: 1536
  wells_per_drc: 13
  wells_per_ps: 1
dashboard:
  enabled: false
data:
  output_dir: /Users/smcolby/repos/moal/examples/demo_output/plan_results
  plan:
    input_csv: /Users/smcolby/repos/moal/examples/demo_output/plan_results/campaign_state.csv
    is_canonical: false
    output_csv: /Users/smcolby/repos/moal/examples/demo_output/plan_results/campaign_state_annotated.csv
    relation_column: relation
    smiles_column: smiles
    value_column: value
model:
  fast: false
  ffn_hidden_size: 300
  ffn_num_layers: 2
  freeze_epochs: 1
  learnable_sigma: false
  lr_encoder: 0.0001
  lr_head: 0.001
  reset_weights_on_refit: true
  sigma: 0.5
  w_drc: 1.0
  w_ps: 1.0
oracle:
  activity_threshold: 6.0
  cost_drc: 10.0
  cost_ps: 1.0
  ps_threshold: 5.0
  upper_bound: 11.0
seed: 42
trainer:
  accelerator: auto
  enable_model_summary: false
  enable_progress_bar: false
  log_every_n_steps: 1
  max_epochs: 5
  num_workers: 0
  split_seed: 42
  val_fraction: 0.1
