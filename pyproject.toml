[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moal"
version = "0.1.0"
description = "Cost-aware synthetic active learning pipeline for cheminformatics"
requires-python = ">=3.11"
dependencies = [
    "chemprop>=2.0,<3.0",
    "lightning>=2.0,<2.6.5",
    "torch>=2.0",
    "rdkit>=2023.3",
    "pandas>=2.0",
    "numpy>=1.25",
    "scipy>=1.11",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "matplotlib>=3.7",
    "Pillow>=9.0",
    "plotly>=5.0",
    "dash>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pandas-stubs",
    "scipy-stubs",
    "pre-commit",
]

[project.scripts]
moal = "moal.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["moal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # lightning 2.6.1 uses LeafSpec() internally; torch 2.10+ deprecated it.
    # The warning surfaces from lightning's own _pytree.py (the call site).
    # Remove once Lightning ships a fix upstream.
    "ignore:`isinstance\\(treespec, LeafSpec\\)` is deprecated:FutureWarning:lightning\\.pytorch\\.utilities\\._pytree",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "D"]
ignore = ["D205", "D401", "S603", "S607", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "D104", "E501", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["chemprop.*", "plotly.*", "dash.*"]
ignore_missing_imports = true
